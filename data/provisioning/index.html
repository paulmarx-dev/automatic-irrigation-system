<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Irrigation Console</title>
  <link rel="stylesheet" href="/provisioning/style.css" />
</head>
<body>
  <main class="wrap">
    <h1>Irrigation Console</h1>
    <p class="sub">AP-only local web access for status and control.</p>

    <section class="card">
      <h2>Web Status</h2>
      <pre id="webStatus">Loading...</pre>
    </section>

    <section class="card">
      <h2>Nodes</h2>
      <div class="sensor-topbar">
        <button type="button" id="addSensorBtn">Add new</button>
      </div>
      <p id="pairingBanner" class="pairing-banner" hidden>Pairing window is open (120s).</p>
      <div id="nodes" class="sensor-list">Loading...</div>
    </section>
  </main>

  <script src="/provisioning/app.js"></script>
</body>
</html>
