; PlatformIO Project Configuration File
;
; Automatic Irrigation System (multi-target)
; - sensor_c3_mini  : Mobile humidity sensor node (ESP32-C3 Mini)
; - control_c3_mini : Control/relay node (ESP32-C3 Mini)
; - head_c6_wroom1  : Irrigation controller/head node (ESP32-C6-WROOM-1)
;
; Switch target in VS Code status bar (Project Environment)
; or from terminal:
;   pio run -e sensor_c3_mini -t upload
;   pio run -e control_c3_mini -t upload
;   pio run -e head_c6_wroom1 -t upload

[platformio]
default_envs = sensor_c3_mini

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600

[env:sensor_c3_mini]
board = lolin_c3_mini
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
build_flags =
	; Compile-time role macro used by #if defined(DEVICE_ROLE_SENSOR)
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D DEVICE_ROLE_SENSOR=1
build_src_filter =
	+<*>
	-<head_unit.cpp>
	-<control_unit.cpp>


[env:control_c3_mini]
board = lolin_c3_mini
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
build_flags =
	; Compile-time role macro used by #if defined(DEVICE_ROLE_CONTROL)
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D DEVICE_ROLE_CONTROL=1
build_src_filter =
	+<*>
	-<head_unit.cpp>
	-<sensor_unit.cpp>
	-<sensors.cpp>

[env:head_c6_wroom1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitc-1
upload_port = /dev/cu.usbmodem51850000571
monitor_port = /dev/cu.usbmodem51850000571
build_flags =
	; Compile-time role macro used by #if defined(DEVICE_ROLE_HEAD)
	${env.build_flags}
	-D DEVICE_ROLE_HEAD=1
build_src_filter =
	+<*>
	-<sensor_unit.cpp>
	-<sensors.cpp>
	-<control_unit.cpp>
lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.12.5
monitor_dtr=0
monitor_rts=0